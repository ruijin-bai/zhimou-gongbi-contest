name: CI

on:
  push:
    branches: [zhimou-b-main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks 8.30.1 and scan code history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p /tmp/zhimou-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/zhimou-gitleaks
          /tmp/zhimou-gitleaks/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts='--all --no-textconv --no-ext-diff'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
